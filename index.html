<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shopping Cart Game</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070e; color: #f4efe6;
        font-family: ui-rounded, "Arial Rounded MT Bold", "Varela Round", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; color: #ff9838; }
      .stat { position: absolute; top: 18px; text-shadow: 0 2px 8px #000; }
      .stat small { display: block; font-size: 11px; letter-spacing: 0.14em; opacity: 0.65; }
      .stat span { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
      #score-box { left: 22px; }
      #speed-box { right: 22px; text-align: right; }
      #pending { position: absolute; top: 30%; width: 100%; text-align: center; font-size: 22px; font-weight: 800;
        color: #9bff5a; font-style: italic; text-shadow: 0 3px 0 #1a2a12, 0 2px 10px #000; font-variant-numeric: tabular-nums; }
      #popups { position: absolute; top: 36%; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .popup { font-size: 28px; font-weight: 900; font-style: italic; color: #fff; background: #d62f55; padding: 4px 20px 6px;
        border-radius: 44% 56% 48% 52% / 58% 46% 54% 42%; box-shadow: 0 4px 0 #6b1730; letter-spacing: 0.02em;
        animation: pop 1.5s ease-out forwards; }
      .popup.bail { background: #9bff5a; color: #1a2a12; box-shadow: 0 4px 0 #3f6a22; font-size: 42px; }
      .popup.info { background: #24323f; box-shadow: 0 3px 0 #0e1820; color: #f1e9e0; font-size: 17px; font-style: normal; font-weight: 700; }
      @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 12% { transform: scale(1.15); opacity: 1; }
        25% { transform: scale(1); } 75% { opacity: 1; } 100% { transform: translateY(-36px); opacity: 0; } }
      .popup.big { background: #e8c547; color: #3a2a10; box-shadow: 0 5px 0 #8a6a1a; font-size: 56px; padding: 2px 34px 8px; }
      #race { position: absolute; top: 22px; width: 100%; text-align: center; font-size: 15px; opacity: 0.9;
        text-shadow: 0 2px 6px #000; font-variant-numeric: tabular-nums; }
      #race b { color: #58ffd0; font-size: 20px; }
      #stamina { position: absolute; left: 22px; top: 84px; display: flex; flex-direction: column; gap: 5px; }
      .cig { display: flex; width: 74px; height: 7px; filter: drop-shadow(0 1px 3px #000); }
      .cig .filter { flex: 0 0 18px; background: #d48a3a; border-radius: 2px 0 0 2px; }
      .cig .paper { flex: 1; display: block; background: rgba(255, 255, 255, 0.13); border-radius: 0 2px 2px 0; }
      .cig .left { display: block; height: 100%; background: #f4efe6; border-right: 3px solid #8d8d8d; box-sizing: border-box;
        border-radius: 0 2px 2px 0; transition: width 0.15s linear; }
      #stamina.burning .left { border-right-color: #ff5a1f; box-shadow: 3px 0 7px #ff5a1f; }
      #arrow { position: absolute; top: 64px; left: 50%; margin-left: -24px; width: 48px; height: 48px; display: none;
        font-size: 44px; line-height: 48px; text-align: center; font-weight: 900; color: #58ffd0; text-shadow: 0 2px 10px #000;
        transition: transform 0.12s linear; }
      #hint { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 14px; opacity: 0.85;
        text-shadow: 0 2px 6px #000; }
      #build { position: absolute; left: 10px; bottom: 6px; font-size: 10px; opacity: 0.45; }
      #hint b { color: #e8c547; }
      #touch { position: fixed; inset: 0; display: none; pointer-events: none; touch-action: none; }
      #touch.on { display: block; }
      #touch > * { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
      #stick { left: 0; bottom: 0; width: 45%; height: 55%; }
      .tbtn { display: grid; place-items: center; border-radius: 50%; border: 2px solid rgba(255, 152, 56, 0.7);
        background: rgba(20, 14, 8, 0.45); color: #ffb469; font-weight: 800; font-size: 14px; }
      #btn-push { right: 22px; bottom: 26px; width: 92px; height: 92px; }
      #btn-hop { right: 128px; bottom: 70px; width: 72px; height: 72px; }
      #btn-reset { right: 22px; top: 76px; width: 46px; height: 46px; font-size: 18px; }
      #btn-race { right: 78px; top: 76px; width: 46px; height: 46px; font-size: 11px; }
      #btn-letgo { right: 134px; top: 76px; width: 46px; height: 46px; font-size: 10px; }
      #btn-throw { right: 118px; bottom: 156px; width: 66px; height: 66px; display: none; }
      #touch.on ~ #hud #hint { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="touch">
      <div id="stick"></div>
      <div id="btn-push" class="tbtn">PUSH</div>
      <div id="btn-hop" class="tbtn">HOP</div>
      <div id="btn-reset" class="tbtn">↺</div>
      <div id="btn-race" class="tbtn">RACE</div>
      <div id="btn-letgo" class="tbtn">LET GO</div>
      <div id="btn-throw" class="tbtn">THROW</div>
    </div>
    <div id="hud">
      <div id="score-box" class="stat"><small>SCORE</small><span id="score">0</span></div>
      <div id="speed-box" class="stat"><small>KM/H</small><span id="speed">0</span></div>
      <div id="stamina"></div>
      <div id="race"></div>
      <div id="arrow">↑</div>
      <div id="pending"></div>
      <div id="popups"></div>
      <div id="hint"></div>
      <div id="build"></div>
    </div>
    <div id="loading">Loading the car park…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
